name: Deploy web to GitHub Pages

# Builds apps/web (Next.js static export) and publishes it to GitHub Pages.
# Runs on every push to main that touches the web app or this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path is relative to the repo root, not the working-directory.
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Push the new URLs to Bing/IndexNow instead of waiting to be crawled.
      # Bing's own queue left maxcandela.com uncrawled indefinitely (2026-08-14);
      # IndexNow is the supported way to ask for a crawl directly.
      # The key file must stay reachable at the keyLocation below — it lives at
      # apps/web/public/<key>.txt so the static export publishes it at the root.
      # Never fails the deploy: indexing is best-effort, the site is already live.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: fda6a6d1bb1812e1a3a98a2b68c8a597
          SITE_HOST: maxcandela.com
        run: |
          set -uo pipefail

          # Pages serves from a CDN, so the fresh sitemap can lag the deploy.
          for attempt in 1 2 3 4 5; do
            sitemap=$(curl -sSf --max-time 30 "https://$SITE_HOST/sitemap.xml") && break
            echo "sitemap not ready (attempt $attempt), retrying..."
            sleep 15
          done

          if [ -z "${sitemap:-}" ]; then
            echo "::warning::could not fetch sitemap; skipping IndexNow"
            exit 0
          fi

          # IndexNow takes a URL list, not a sitemap, so pull the <loc> values out.
          urls=$(printf '%s' "$sitemap" \
            | grep -oE '<loc>[^<]+</loc>' \
            | sed -E 's|</?loc>||g' \
            | jq -R . | jq -sc .)

          echo "submitting $(printf '%s' "$urls" | jq 'length') URLs"

          jq -nc \
            --arg host "$SITE_HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg loc "https://$SITE_HOST/$INDEXNOW_KEY.txt" \
            --argjson urlList "$urls" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urlList}' \
            > payload.json

          # 200 = accepted, 202 = accepted but key still being validated.
          code=$(curl -sS --max-time 30 -o response.txt -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/IndexNow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @payload.json)

          echo "IndexNow responded $code"
          cat response.txt || true
          [ "$code" = "200" ] || [ "$code" = "202" ] \
            || echo "::warning::IndexNow returned $code"
