# XcodeGen spec for the App Store build. Generates MaxCandela.xcodeproj from the
# same Swift sources the SwiftPM package uses, so you get Xcode's familiar
# Archive → Distribute flow. Regenerate any time with:  xcodegen generate
#
# Requires: brew install xcodegen
name: MaxCandela
options:
  bundleIdPrefix: com.maxcandela
  deploymentTarget:
    macOS: "15.6"
  createIntermediateGroups: true

# Keep the version in step with Package.swift (the SwiftPM dev build).
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.87.1

settings:
  base:
    MARKETING_VERSION: "1.1.7"
    CURRENT_PROJECT_VERSION: "17"
    DEVELOPMENT_TEAM: YU66583SCF          # your Apple Developer team
    SWIFT_VERSION: "5.9"

targets:
  MaxCandela:
    type: application
    platform: macOS
    sources:
      - path: Sources/MaxCandela          # all the .swift + the SPM AppIcon.png
      - path: Resources/Assets.xcassets    # the app-icon asset catalog
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_NAME: MaxCandela
        PRODUCT_BUNDLE_IDENTIFIER: com.maxcandela.MaxCandela
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO        # use our Info.plist verbatim
        CODE_SIGN_ENTITLEMENTS: Resources/MaxCandela.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      # Inject the GA API secret and the RevenueCat public SDK key from the
      # repo-root .env (gitignored) into the built app's Info.plist, before
      # code signing. Missing .env / missing value ⇒ that integration stays
      # off. Keeps the secret out of the repo, same as the CLI bundler.
      - name: Inject analytics keys from .env
        basedOnDependencyAnalysis: false
        script: |
          ENV_FILE="$SRCROOT/../../.env"
          [ -f "$ENV_FILE" ] || { echo "no .env — skipping analytics keys"; exit 0; }
          set -a; source "$ENV_FILE"; set +a
          PLIST="$BUILT_PRODUCTS_DIR/$INFOPLIST_PATH"
          inject() {  # inject <plist key> <value>
            [ -n "$2" ] || { echo "no value for $1 — skipping"; return 0; }
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
            echo "Injected $1 into $PLIST"
          }
          inject GAApiSecret "${GA_API_SECRET:-}"
          inject RCPublicAPIKey "${RC_PUBLIC_API_KEY:-}"
